name: WebSafe Manual Research

on:
  workflow_dispatch:
    inputs:
      website:
        description: "Website URL to research"
        required: true
        default: "https://example.com"
        type: string

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: node --check agent.js

      - name: Run WebSafe Research AI
        run: node agent.js "${{ inputs.website }}"
